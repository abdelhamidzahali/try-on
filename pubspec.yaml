name: envisionfit
description: "Step into the future of fashion with our AI stylist app, where you can virtually try on any outfit and visualize your perfect look with just a snap!"
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  image: ^4.0.0
  url_launcher: ^6.0.0
  image_gallery_saver: ^2.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  image_picker: '>=1.1.2'
  shared_preferences: ^2.0.0
  path_provider: ^2.0.0
  http: ^1.0.0
  permission_handler: ^12.0.0
  supabase_flutter: '>=1.10.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/Images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app-icon-1024x1024_1.png
  remove_alpha_ios: true
