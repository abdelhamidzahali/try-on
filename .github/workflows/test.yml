name: Tests

on:
  push:
    branches: [Design_Revamp]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
